# -*- coding: utf-8 -*-
; 配置文件
; 说明：标题格式："名称_环境"，名称不要有'_'，如配置适用所有环境，则直接使用"名称"
; 应用访问方式：settings.名称_配置项
[db_local]
name = dba
address = 10.111.253.23
username = postgres
password = postgres
port = 5432

[db_dev]
name = dba
address = 10.111.253.23
username = postgres
password = postgres
port = 5432

[db_test]
name = test
address = 10.111.253.23
username = postgres
password = postgres
port = 5432

; 数据源纳管与元数据采集
; secret_key 用于加密数据源密码，上线前必须替换为随机值
; 注意：本文件当前已被 git 跟踪，密钥存在泄露风险（见 openspec/changes/add-datasource-catalog/design.md D9）
[datasource]
secret_key = yX5TrgHD_q51-WNpGTFgV3Hd_RvsM2HS20tWqS-J-eYSdadlaa8zNiD7HXqSTjaM
; 连接与语句超时（秒）
connect_timeout = 5
statement_timeout = 30
; 精确行数统计（COUNT(*)），大表代价高，默认关闭，行数改用估算值
exact_count = false

; 知识问答
; 注意：模型 API Key 不在这里，存在 llm_provider 表并加密（见 design.md D3）
[knowledge]
; Qdrant 服务地址与集合名（向量维度由代码常量 EMBEDDING_DIMENSIONS 决定）
qdrant_url = http://10.111.253.23:6333
qdrant_collection = my_dba_kb
; 模型调用超时（秒）
llm_timeout = 60
; 检索返回条数与相似度阈值（余弦相似度，低于阈值视为「无命中」）
retrieval_top_k = 5
similarity_threshold = 0.35
; 文档切分块大小与重叠窗口（字符数）
chunk_size = 800
chunk_overlap = 120
; agent 单次回答最多调用工具的步数，以及多轮上下文保留的轮数
agent_max_steps = 6
history_rounds = 6










; SQL 分析
; 试运行只在显式触发时执行，且只跑只读语句；这里是它的行数上限与语句超时（秒）
[sqlanalysis]
max_rows = 100
statement_timeout = 30

; 数据源指标采集（首页展示用）
; 采集由 jobs/metrics.py 常驻进程执行，间隔与保留期在这里配
[datasource_metrics]
interval = 300
retention_days = 30
probe_timeout = 5
